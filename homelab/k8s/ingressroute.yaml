---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vimes
  namespace: agents-shared
  labels:
    app.kubernetes.io/name: vimes
spec:
  # Cloudflare terminates TLS and the tunnel speaks plain HTTP to Traefik's
  # `web` entrypoint; a websecure-only router, a `tls:` block (TLS-only
  # routers on every entrypoint) or a cross-namespace middleware ref
  # (allowCrossNamespace is off) each make Traefik drop the router -> 404.
  entryPoints: [web]
  routes:
    - match: Host(`vimes.leopaska.xyz`)
      kind: Rule
      services:
        - { name: vimes, port: 3000 }
      middlewares:
        - { name: authelia }   # agents-shared copy (homelab infrastructure/authelia-middleware.yaml)
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vimes-leopaska-tls
  namespace: agents-shared
spec:
  secretName: vimes-leopaska-tls
  dnsNames: [vimes.leopaska.xyz]
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
